<title>Survive the Hive</title>
<meta property="og:title" content="Survive the Hive">

<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐝</text></svg>">
<style>
:root{ --bg:#2B1A0A; --ink:#FFF6DA; --muted:#F2D69A; --honey:#FFB800; box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); color-scheme:dark; }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#231505; } }
:root[data-theme="dark"]{ --bg:#231505; }
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--bg);color:var(--ink);font-family:'Trebuchet MS','Segoe UI',system-ui,sans-serif}
.card{width:min(420px,100%);background:#3A2410;border-radius:20px;padding:28px 24px;text-align:center;box-shadow:0 0 0 4px #5A3A12,0 10px 0 rgba(0,0,0,.4);display:flex;flex-direction:column;gap:14px}
h1{margin:0;font-size:2rem;color:var(--honey);letter-spacing:.02em}
p{margin:0;color:var(--muted)}
label{font-weight:700;text-align:left}
input{min-height:48px;border-radius:12px;border:2px solid #8A5A00;background:#FFF6DA;color:#2B1A0A;font-size:18px;padding:0 14px;width:100%}
button{min-height:50px;border-radius:12px;border:0;background:var(--honey);color:#2B1A0A;font-size:18px;font-weight:800;cursor:pointer;box-shadow:0 5px 0 #8A5A00}
button:active{transform:translateY(3px);box-shadow:0 2px 0 #8A5A00}
:focus-visible{outline:3px solid var(--honey);outline-offset:3px}
.err{min-height:22px;color:#FF8FA3;font-weight:700}
</style>
</head>
<body>

</form>

  function b64(s){ var bin = atob(s), u = new Uint8Array(bin.length); for(var i=0;i<bin.length;i++) u[i] = bin.charCodeAt(i); return u; }
  async function unlock(pw){
    var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(String(pw).trim().toLowerCase()), 'PBKDF2', false, ['deriveKey']);
    var key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(DATA.salt), iterations:DATA.iter, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
    var out = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(DATA.iv)}, key, b64(DATA.ct));
    return new TextDecoder().decode(out);
  }
  async function attempt(pw, remember){
    var btn = document.getElementById('go'), err = document.getElementById('err');
    btn.disabled = true; btn.textContent = 'Checking…'; err.textContent = '';
    try{
      var html = await unlock(pw);
      if(remember){ try{ sessionStorage.setItem('hive-pw', pw); }catch(e){} }
      document.open(); document.write(html); document.close();
    }catch(e){
      btn.disabled = false; btn.textContent = 'Unlock';
      err.textContent = (window.crypto && crypto.subtle) ? 'Nope, that’s not it. 🐝' : 'This browser view can’t unlock it. Open the link in Safari or Chrome.';
      try{ sessionStorage.removeItem('hive-pw'); }catch(e2){}
      document.getElementById('pw').select();
    }
  }
  document.getElementById('f').addEventListener('submit', function(e){ e.preventDefault(); attempt(document.getElementById('pw').value, true); });

  if(saved) attempt(saved, false); else document.getElementById('pw').focus();
